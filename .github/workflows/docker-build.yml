name: Build and Push Docker Images

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pdns image
        uses: docker/build-push-action@v2
        with:
          context: ./pdns
          file: ./pdns/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdns:latest

      - name: Build and push db image
        uses: docker/build-push-action@v2
        with:
          context: ./db
          file: ./db/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdns-db:latest

      - name: Build and push pdns-admin image
        uses: docker/build-push-action@v2
        with:
          context: ./pdns-admin
          file: ./pdns-admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdns-admin:latest

name: CI

on:
  push:
    branches: [main, dev, 'claude/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. Without this the GITHUB_TOKEN gets whatever
# the repository default is, which for older repositories is read/write on
# everything -- so a compromised action or dependency could push commits or
# publish packages. The publish job re-declares what it actually needs
# (packages: write); a job-level block overrides this one.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Must match webui/Dockerfile. Testing on a different interpreter
          # than the image ships means the suite has never run on what
          # production actually executes.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: webui/requirements.txt

      - name: Install dependencies
        working-directory: webui
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        working-directory: webui
        run: ruff check app tests

      - name: Check formatting
        working-directory: webui
        run: ruff format --check app tests

      - name: Run tests
        working-directory: webui
        run: pytest --cov=app --cov-report=term-missing

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Discovered rather than listed: a hardcoded list silently goes stale
          # when a script is renamed, and fails the build when one is removed.
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts found -- the glob is wrong" >&2
            exit 1
          fi
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  smoke:
    name: End-to-end compose smoke test
    runs-on: ubuntu-latest
    env:
      # Layers compose.ci.yml on top, so every `docker compose` call below
      # still runs the real compose.yml.
      COMPOSE_FILE: compose.yml:compose.ci.yml
    steps:
      - uses: actions/checkout@v7

      - name: Generate secrets and .env
        run: |
          set -euo pipefail
          ./scripts/generate-secrets.sh
          # systemd-resolved holds :53 on GitHub runners, so publish DNS
          # somewhere free. The container still serves on 53 internally.
          {
            echo 'DNS_BIND_ADDRESS=127.0.0.1'
            echo 'DNS_PORT=5353'
            # The recursor is the front door on DNS_PORT; publish the
            # authoritative server as well so each half can be queried on its
            # own and a failure says which one is at fault.
            echo 'AUTH_DNS_BIND_ADDRESS=127.0.0.1'
            echo 'AUTH_DNS_PORT=5300'
          } >> .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: |
          set -euo pipefail
          if ! docker compose up -d; then
            echo "::error::docker compose up failed"
            docker compose ps -a
            docker compose logs --tail 100
            exit 1
          fi

      - name: Wait for every service to report healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            unhealthy=""
            for service in db pdns recursor webui; do
              id=$(docker compose ps -q "$service")
              if [ -z "$id" ]; then unhealthy="$unhealthy $service(missing)"; continue; fi
              state=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
              [ "$state" = "healthy" ] || [ "$state" = "running" ] || unhealthy="$unhealthy $service($state)"
            done
            if [ -z "$unhealthy" ]; then echo "all services are up"; exit 0; fi
            echo "waiting for:$unhealthy"
            sleep 5
          done
          echo "services did not become healthy in time" >&2
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - name: PowerDNS loaded the gpgsql schema
        run: |
          set -euo pipefail
          # An empty list is the correct answer; an error means the schema or
          # the database credentials are wrong.
          docker compose exec -T db psql -U postgres -d pdns -c '\dt' | tee /tmp/tables.txt
          for table in domains records cryptokeys domainmetadata tsigkeys comments supermasters; do
            grep -q " $table " /tmp/tables.txt || { echo "missing table: $table" >&2; exit 1; }
          done

      - name: The admin panel's schema is separate from PowerDNS's
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U postgres -d pdns -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='pdnsadmin' ORDER BY 1" \
            | tee /tmp/admin_tables.txt
          for table in users zone_access audit_log app_settings; do
            grep -q "$table" /tmp/admin_tables.txt || { echo "missing table: $table" >&2; exit 1; }
          done

      - name: Neither application role is a superuser
        run: |
          set -euo pipefail
          # The whole point of the separate bootstrap role: if either of these
          # comes back as a superuser, the privilege separation below is
          # decorative.
          for role in pdns pdnsadmin; do
            super=$(docker compose exec -T db psql -U postgres -d pdns -tAc \
              "SELECT rolsuper OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname='$role'")
            echo "$role privileged: $super"
            [ "$super" = "f" ] || { echo "$role must not be superuser/createrole/createdb" >&2; exit 1; }
          done
          # And the tables must belong to pdns, not to the bootstrap superuser.
          owner=$(docker compose exec -T db psql -U postgres -d pdns -tAc \
            "SELECT tableowner FROM pg_tables WHERE schemaname='public' AND tablename='records'")
          echo "records owner: $owner"
          [ "$owner" = "pdns" ] || { echo "records should be owned by pdns, got $owner" >&2; exit 1; }

      - name: Each role is denied the other's tables
        run: |
          set -euo pipefail
          # Prove the isolation rather than assume it. Both of these must fail.
          if docker compose exec -T db psql -U pdnsadmin -d pdns -tAc \
               'SELECT count(*) FROM public.domains' 2>/tmp/denied_a.txt; then
            echo "pdnsadmin could read the PowerDNS tables" >&2; exit 1
          fi
          grep -qi "permission denied" /tmp/denied_a.txt \
            || { echo "expected a permission error, got:" >&2; cat /tmp/denied_a.txt >&2; exit 1; }
          echo "pdnsadmin -> public.domains: denied"

          if docker compose exec -T db psql -U pdns -d pdns -tAc \
               'SELECT count(*) FROM pdnsadmin.users' 2>/tmp/denied_b.txt; then
            echo "pdns could read the admin panel's tables" >&2; exit 1
          fi
          grep -qi "permission denied" /tmp/denied_b.txt \
            || { echo "expected a permission error, got:" >&2; cat /tmp/denied_b.txt >&2; exit 1; }
          echo "pdns -> pdnsadmin.users: denied"

      - name: The web UI answers and serves the Tabler theme
        run: |
          set -euo pipefail
          curl -fsS http://localhost:9191/healthz | tee /dev/stderr | grep -q '"status": *"ok"'
          # readyz proves the panel reached both PostgreSQL and the PowerDNS API.
          curl -fsS http://localhost:9191/readyz | tee /dev/stderr | grep -q '"powerdns": *true'
          curl -fsS http://localhost:9191/auth/login | grep -q "Sign in to your account"
          # Vendored at build time, so this must be served from our own origin.
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            http://localhost:9191/static/vendor/tabler/tabler.min.css | grep -q 200
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            http://localhost:9191/static/vendor/tabler/fonts/tabler-icons.woff2 | grep -q 200

      - name: Create a zone through the API and resolve it over real DNS
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y dnsutils

          # Driven from the webui container: it is the one that talks to the
          # API in production, so this exercises the real internal path. The
          # pdns image ships no HTTP client, by design.
          docker compose exec -T webui python - "$(cat secrets/pdns_api_key)" <<'PY'
          import json, sys, urllib.request

          key = sys.argv[1]

          def call(method, path, body=None):
              request = urllib.request.Request(
                  "http://pdns:8081/api/v1" + path,
                  method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"X-API-Key": key, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(method, path, "->", response.status)
                  return response.status

          call("POST", "/servers/localhost/zones", {
              "name": "smoke.test.",
              "kind": "Native",
              "nameservers": ["ns1.smoke.test."],
          })
          call("PATCH", "/servers/localhost/zones/smoke.test.", {
              "rrsets": [{
                  "name": "www.smoke.test.",
                  "type": "A",
                  "ttl": 60,
                  "changetype": "REPLACE",
                  "records": [{"content": "192.0.2.42", "disabled": False}],
              }]
          })
          PY

          # The real test: PowerDNS reads it back out of PostgreSQL and answers
          # a query. Asked of the authoritative server directly, so this stays
          # a test of pdns alone -- the recursor path is checked next.
          for attempt in $(seq 1 12); do
            answer=$(dig +short @127.0.0.1 -p 5300 www.smoke.test A || true)
            [ "$answer" = "192.0.2.42" ] && break
            echo "attempt $attempt: got '${answer:-<empty>}', retrying"
            sleep 5
          done
          echo "dig returned: ${answer:-<empty>}"
          if [ "$answer" != "192.0.2.42" ]; then
            echo "::error::PowerDNS did not serve the record created through the API"
            dig @127.0.0.1 -p 5300 www.smoke.test A || true
            docker compose logs --tail 50 pdns
            exit 1
          fi

      - name: A shared sign-in for the steps that drive the panel
        run: |
          set -euo pipefail
          jar=/tmp/panel.jar
          token=$(curl -fsS -c "$jar" http://localhost:9191/auth/login \
                  | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -b "$jar" -c "$jar" -o /dev/null \
            -X POST http://localhost:9191/auth/login \
            --data-urlencode "username=admin" \
            --data-urlencode "password=$(cat secrets/webui_admin_password)" \
            --data-urlencode "csrf_token=$token"
          # The CSRF token is per session, so one read is enough for every POST
          # below. Taken from a page that does not itself reconcile forwarding,
          # which matters for the global-forwarder test further down.
          curl -fsS -b "$jar" http://localhost:9191/zones/ \
            | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | cut -d'"' -f4 > /tmp/panel.csrf
          echo "signed in; token length $(wc -c < /tmp/panel.csrf)"

      - name: The recursor answers for the authoritative zones
        run: |
          set -euo pipefail
          # The recursor is the front door, so a zone this stack hosts is only
          # answerable there if the panel keeps a forward rule pointing at the
          # authoritative server. Ask it to reconcile, then query the recursor.
          curl -fsS -b /tmp/panel.jar -o /dev/null -X POST \
            http://localhost:9191/forwarding/sync \
            --data-urlencode "csrf_token=$(cat /tmp/panel.csrf)"

          # What the recursor actually knows, before any dig. A silent retry
          # loop cannot distinguish "the rule was never created" from "the
          # rule exists but the query never arrives", and those have entirely
          # different fixes.
          echo "--- what the recursor is forwarding, and where pdns is ---"
          docker compose exec -T webui python - "$(cat secrets/recursor_api_key)" <<'PY'
          import json, socket, sys, urllib.request

          request = urllib.request.Request(
              "http://recursor:8082/api/v1/servers/localhost/zones",
              headers={"X-API-Key": sys.argv[1]},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              zones = json.load(response)
          forwarded = {z["name"]: z["servers"] for z in zones if z["kind"] == "Forwarded"}
          print("forwarded:", json.dumps(forwarded, indent=2, sort_keys=True))
          print("pdns resolves to:", socket.gethostbyname("pdns"))
          print("recursor resolves to:", socket.gethostbyname("recursor"))
          PY

          # dig sets the DNSSEC OK bit by default, so this is also the
          # regression test for validating a forwarded zone: a resolver that
          # tried would ask the root whether smoke.test is signed, be told it
          # does not exist there, and SERVFAIL a correct answer.
          sleep 5
          for attempt in $(seq 1 10); do
            answer=$(dig +short @127.0.0.1 -p 5353 www.smoke.test A || true)
            [ "$answer" = "192.0.2.42" ] && break
            status=$(dig @127.0.0.1 -p 5353 www.smoke.test A +time=3 +tries=1 \
                     | grep -oP 'status: \K[A-Z]+' | head -1 || true)
            echo "attempt $attempt: got '${answer:-<empty>}' (${status:-no reply})"
            docker compose exec -T recursor rec_control wipe-cache 'smoke.test$' \
              >/dev/null 2>&1 || true
            sleep 5
          done
          echo "dig via the recursor returned: ${answer:-<empty>}"
          if [ "$answer" != "192.0.2.42" ]; then
            echo "::error::the recursor did not answer for an authoritative zone"
            echo "--- is the recursor listening on 53 at all? ---"
            docker compose exec -T recursor timeout 2 bash -c '</dev/tcp/127.0.0.1/53' \
              && echo "port 53 inside the container: open" \
              || echo "port 53 inside the container: CLOSED"
            echo "--- straight at the recursor from inside the network ---"
            docker compose exec -T webui python -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(4)
          # A minimal A query for www.smoke.test, so this does not need dig.
          q = (b'\xab\xcd\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00'
               b'\x03www\x05smoke\x04test\x00\x00\x01\x00\x01')
          try:
              s.sendto(q, ('recursor', 53))
              data, _ = s.recvfrom(512)
              print('recursor replied, rcode', data[3] & 0x0F, 'answers', data[7])
          except Exception as exc:
              print('no reply from recursor:53 --', type(exc).__name__, exc)
          " || true
            docker compose logs --tail 80 recursor
            exit 1
          fi

      - name: A forward zone created in the panel resolves
        run: |
          set -euo pipefail
          # A zone the authoritative server holds but that no forward rule
          # covers yet: it did not exist at the reconcile above, so the only
          # rule for it will be the one created through the panel below.
          docker compose exec -T webui python - "$(cat secrets/pdns_api_key)" <<'PY'
          import json, sys, urllib.request

          key = sys.argv[1]

          def call(method, path, body):
              request = urllib.request.Request(
                  "http://pdns:8081/api/v1" + path,
                  method=method,
                  data=json.dumps(body).encode(),
                  headers={"X-API-Key": key, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(method, path, "->", response.status)

          call("POST", "/servers/localhost/zones", {
              "name": "fwd.test.", "kind": "Native", "nameservers": ["ns1.fwd.test."],
          })
          call("PATCH", "/servers/localhost/zones/fwd.test.", {
              "rrsets": [{
                  "name": "host.fwd.test.", "type": "A", "ttl": 60,
                  "changetype": "REPLACE",
                  "records": [{"content": "192.0.2.77", "disabled": False}],
              }]
          })
          PY

          curl -fsS -b /tmp/panel.jar -o /dev/null -X POST \
            http://localhost:9191/forwarding/new \
            --data-urlencode "name=fwd.test" \
            --data-urlencode "servers=${PDNS_STATIC_IP:-172.29.0.10}" \
            --data-urlencode "csrf_token=$(cat /tmp/panel.csrf)"

          # Same settle-and-flush as above: the reloaded zone map reaches the
          # worker threads asynchronously, and a query that lands before it
          # does is answered the old way and cached for a minute.
          sleep 5
          for attempt in $(seq 1 12); do
            answer=$(dig +short @127.0.0.1 -p 5353 host.fwd.test A || true)
            [ "$answer" = "192.0.2.77" ] && break
            echo "attempt $attempt: got '${answer:-<empty>}', retrying"
            docker compose exec -T recursor rec_control wipe-cache 'fwd.test$' \
              >/dev/null 2>&1 || true
            sleep 5
          done
          echo "forward zone resolved to: ${answer:-<empty>}"
          if [ "$answer" != "192.0.2.77" ]; then
            echo "::error::a forward zone created in the panel did not take effect"
            curl -fsS -b /tmp/panel.jar http://localhost:9191/forwarding/ | grep -i fwd.test || true
            docker compose logs --tail 50 recursor
            exit 1
          fi
          # And it is listed on the page.
          curl -fsS -b /tmp/panel.jar http://localhost:9191/forwarding/ | grep -q "fwd.test."

          # Explicitly with and without the DNSSEC OK bit. A forwarded zone is
          # answered from outside the public chain, so a resolver that
          # validated it would SERVFAIL the +dnssec form while the plain one
          # worked -- which is what shipped before this was pinned.
          for flag in +dnssec +nodnssec; do
            got=$(dig +short "$flag" @127.0.0.1 -p 5353 host.fwd.test A || true)
            echo "  dig $flag -> ${got:-<empty>}"
            [ "$got" = "192.0.2.77" ] || {
              echo "::error::a forwarded zone does not answer with $flag"
              exit 1
            }
          done

      - name: Global forwarders take effect
        run: |
          set -euo pipefail
          # A zone with no forward rule of its own: the recursor has to fall
          # back to the global forwarders to answer for it. Created after the
          # reconcile, and nothing below loads the Forwarding page, so no
          # local-zone rule can appear and make this pass for the wrong reason.
          docker compose exec -T webui python - "$(cat secrets/pdns_api_key)" <<'PY'
          import json, sys, urllib.request

          key = sys.argv[1]

          def call(method, path, body):
              request = urllib.request.Request(
                  "http://pdns:8081/api/v1" + path,
                  method=method,
                  data=json.dumps(body).encode(),
                  headers={"X-API-Key": key, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(method, path, "->", response.status)

          call("POST", "/servers/localhost/zones", {
              "name": "global.test.", "kind": "Native", "nameservers": ["ns1.global.test."],
          })
          call("PATCH", "/servers/localhost/zones/global.test.", {
              "rrsets": [{
                  "name": "host.global.test.", "type": "A", "ttl": 60,
                  "changetype": "REPLACE",
                  "records": [{"content": "192.0.2.88", "disabled": False}],
              }]
          })
          PY

          # Before: nothing forwards it, so the recursor resolves it from the
          # root servers and finds nothing -- .test is reserved and never
          # delegated. An answer here would mean the test proves nothing.
          before=$(dig +short @127.0.0.1 -p 5353 host.global.test A || true)
          echo "before global forwarders: '${before:-<empty>}'"
          if [ -n "$before" ]; then
            echo "::error::host.global.test resolved before any forwarder was set"
            exit 1
          fi

          curl -fsS -b /tmp/panel.jar -o /dev/null -X POST \
            http://localhost:9191/forwarding/global \
            --data-urlencode "servers=${PDNS_STATIC_IP:-172.29.0.10}" \
            --data-urlencode "csrf_token=$(cat /tmp/panel.csrf)"

          sleep 5
          for attempt in $(seq 1 12); do
            answer=$(dig +short @127.0.0.1 -p 5353 host.global.test A || true)
            [ "$answer" = "192.0.2.88" ] && break
            echo "attempt $attempt: got '${answer:-<empty>}', retrying"
            docker compose exec -T recursor rec_control wipe-cache 'global.test$' \
              >/dev/null 2>&1 || true
            sleep 5
          done
          echo "after global forwarders: ${answer:-<empty>}"
          if [ "$answer" != "192.0.2.88" ]; then
            echo "::error::global forwarders did not take effect"
            docker compose logs --tail 50 recursor
            exit 1
          fi

      - name: Forward zones survive a restart of the recursor
        run: |
          set -euo pipefail
          # They live in the recursor's api-config-dir, which is a named
          # volume. Without it every forward zone is lost when the container
          # is replaced, and nothing else in this job would notice.
          docker compose restart recursor
          sleep 10

          # Asked of the recursor's own API rather than with dig: the global
          # forwarders set above also point at the authoritative server, so a
          # query for host.fwd.test would still be answered even if this
          # zone's rule had been lost. The zone list cannot pass for that
          # reason.
          docker compose exec -T webui python - "$(cat secrets/recursor_api_key)" <<'PY'
          import json, sys, urllib.error, urllib.request

          key = sys.argv[1]
          request = urllib.request.Request(
              "http://recursor:8082/api/v1/servers/localhost/zones",
              headers={"X-API-Key": key},
          )
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      zones = json.load(response)
                  break
              except (urllib.error.URLError, TimeoutError) as exc:
                  print("recursor not up yet:", exc)
                  import time
                  time.sleep(5)
          else:
              raise SystemExit("the recursor API never came back after the restart")

          forwarded = {
              zone["name"]: zone["servers"] for zone in zones if zone["kind"] == "Forwarded"
          }
          print("forwarded after restart:", json.dumps(forwarded, indent=2, sort_keys=True))
          missing = [name for name in ("fwd.test.", ".", "smoke.test.") if name not in forwarded]
          if missing:
              raise SystemExit(f"lost after the restart: {missing}")
          PY

          # And it still answers.
          for attempt in $(seq 1 12); do
            answer=$(dig +short @127.0.0.1 -p 5353 host.fwd.test A || true)
            [ "$answer" = "192.0.2.77" ] && break
            echo "attempt $attempt: got '${answer:-<empty>}', retrying"
            docker compose exec -T recursor rec_control wipe-cache 'fwd.test$' \
              >/dev/null 2>&1 || true
            sleep 5
          done
          echo "after restart: ${answer:-<empty>}"
          [ "$answer" = "192.0.2.77" ] || {
            echo "::error::forward zones did not survive a restart"
            docker compose logs --tail 50 recursor
            exit 1
          }

      - name: The recursor is not an open resolver
        run: |
          set -euo pipefail
          # allow-from is what keeps this off the list of resolvers used to
          # amplify attacks on other people. Prove the default is narrow by
          # reading it back out of the running configuration.
          allow=$(docker compose exec -T recursor \
                    sed -n '/^incoming:/,/^[a-z]/p' /etc/powerdns/recursor.yml \
                    | grep 'allow_from:')
          echo "$allow"
          case "$allow" in
            *0.0.0.0/0*|*"::/0"*)
              echo "::error::the recursor is configured as an open resolver"
              exit 1 ;;
          esac
          # And it really is the file the recursor read: a config it could not
          # parse would have stopped the container long before this step.
          docker compose exec -T recursor test -s /etc/powerdns/recursor.yml

      - name: The zone shows up in the panel for the administrator
        run: |
          set -euo pipefail
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" http://localhost:9191/auth/login \
                  | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -b "$jar" -c "$jar" -o /dev/null \
            -X POST http://localhost:9191/auth/login \
            --data-urlencode "username=admin" \
            --data-urlencode "password=$(cat secrets/webui_admin_password)" \
            --data-urlencode "csrf_token=$token"
          curl -fsS -b "$jar" http://localhost:9191/zones/ | grep -q "smoke.test."
          # And the record editor renders the record we just created.
          curl -fsS -b "$jar" "http://localhost:9191/zones/smoke.test." | grep -q "192.0.2.42"

      - name: A wrong password is refused
        run: |
          set -euo pipefail
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" http://localhost:9191/auth/login \
                  | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
          code=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' \
                 -X POST http://localhost:9191/auth/login \
                 --data-urlencode "username=admin" \
                 --data-urlencode "password=definitely-not-the-password" \
                 --data-urlencode "csrf_token=$token")
          echo "bad password returned $code"
          [ "$code" = "401" ] || exit 1

      - name: A request without a CSRF token is rejected
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 http://localhost:9191/auth/login -d 'username=admin&password=x')
          echo "unprotected POST returned $code"
          [ "$code" = "400" ] || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test, shellcheck, smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./pdns
            image: pdns
          - context: ./recursor
            image: pdns-recursor
          - context: ./db
            image: pdns-db
          - context: ./webui
            image: pdns-webui
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

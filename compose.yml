version: '3.9'

services:
  powerdns:
    image: ghcr.io/timothestoifl24/powerdns:latest
    container_name: powerdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    environment:
      - PDNS_gmysql_host=db
      - PDNS_gmysql_user=${MYSQL_USER}
      - PDNS_gmysql_password_file=/run/secrets/mysql_password
      - PDNS_gmysql_dbname=${MYSQL_DATABASE}
    volumes:
      - powerdns_data:/etc/powerdns
      - ./pdns.conf:/etc/powerdns/pdns.conf
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - mysql_password
      - powerdns_api

  db:
    image: mariadb:latest
    container_name: powerdns-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
    secrets:
      - mysql_root_password
      - mysql_password

volumes:
  db_data:
  powerdns_data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.key
  mysql_password:
    file: ./secrets/mysql_password.key
  powerdns_api:
    file: ./secrets/powerdns_api.key

# PostgreSQL 18 with the PowerDNS schema and both application roles.
#
# A StatefulSet of one: the database is the only stateful piece besides the
# recursor's forward zones, and it is not replicated. The init scripts in the
# image run only against an empty volume, exactly as under compose.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
spec:
  # Headless: the StatefulSet's stable pod name is what the others reach.
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      containers:
        - name: db
          image: ghcr.io/timothestoifl24/pdns-db
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: powerdns-settings, key: DB_NAME }
            # The bootstrap superuser. It runs initdb and the init scripts,
            # and nothing connects as it afterwards.
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: powerdns-settings, key: DB_SUPERUSER }
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db_superuser_password
            - name: PDNS_DB_USER
              valueFrom:
                configMapKeyRef: { name: powerdns-settings, key: PDNS_DB_USER }
            - name: PDNS_DB_PASSWORD_FILE
              value: /run/secrets/pdns_db_password
            - name: WEBUI_DB_USER
              valueFrom:
                configMapKeyRef: { name: powerdns-settings, key: WEBUI_DB_USER }
            - name: WEBUI_DB_PASSWORD_FILE
              value: /run/secrets/webui_db_password
            - name: WEBUI_DB_SCHEMA
              valueFrom:
                configMapKeyRef: { name: powerdns-settings, key: WEBUI_DB_SCHEMA }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            # /var/lib/postgresql, not .../data: PostgreSQL 18 keeps the
            # cluster in /var/lib/postgresql/18/docker. Mounting the parent
            # also keeps the volume's lost+found out of PGDATA, which initdb
            # would otherwise refuse to use. See docs/upgrading.md.
            - name: data
              mountPath: /var/lib/postgresql
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: powerdns-secrets
            # World-readable inside the pod, as Docker secrets are: the init
            # scripts run as the unprivileged postgres user.
            defaultMode: 0444
            items:
              - { key: db_superuser_password, path: db_superuser_password }
              - { key: pdns_db_password, path: pdns_db_password }
              - { key: webui_db_password, path: webui_db_password }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

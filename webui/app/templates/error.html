<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }} · {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler/tabler-icons.min.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
</head>
<body class="d-flex flex-column bg-surface-secondary">
<div class="page page-center">
  <div class="container-tight py-4">
    <div class="empty">
      <div class="empty-header">{{ code }}</div>
      <p class="empty-title">{{ title }}</p>
      <p class="empty-subtitle text-secondary">{{ message }}</p>
      <div class="empty-action">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
          <i class="ti ti-arrow-left me-2"></i>Back to safety
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>

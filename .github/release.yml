# Categories for the release notes GitHub generates from merged pull requests.
#
# The release workflow calls the generate-notes API, which reads this file and
# sorts every PR merged since the previous tag into the sections below. A PR
# lands in the first category whose labels it carries, so the order matters:
# `dependencies` outranks `bug` because Dependabot labels its pull requests
# with both, and they read as dependency bumps rather than as fixes.
#
# The hand-written summary in CHANGELOG.md is what the release leads with; this
# is the exhaustive list underneath it, and it is what catches the PRs nobody
# remembered to write down.
changelog:
  exclude:
    labels:
      # Nothing a reader of the release notes would act on.
      - skip-changelog
      - duplicate
      - invalid
      - question

  categories:
    - title: Breaking changes
      labels:
        - breaking

    - title: Security
      labels:
        - security

    - title: Features
      labels:
        - feature
        - enhancement

    - title: Dependencies
      labels:
        - dependencies

    - title: Fixes
      labels:
        - bug
        - fix

    - title: Documentation
      labels:
        - docs
        - documentation

    - title: Build and CI
      labels:
        - ci
        - github-actions

    # Everything that carried no label at all. Deliberately last and
    # deliberately present: a silently dropped PR is worse than an untidy
    # section, and this is the prompt to go and label it.
    - title: Other changes
      labels:
        - "*"

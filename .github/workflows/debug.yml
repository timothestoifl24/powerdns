name: Debug PowerDNS Admin Build

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Clone PowerDNS-Admin Repository
        run: |
          git clone https://github.com/PowerDNS-Admin/PowerDNS-Admin.git /opt/webapp
          echo "Cloned PowerDNS-Admin repository."

      - name: List contents of /opt/webapp
        run: ls -la /opt/webapp

      - name: Install Python Dependencies
        run: |
          cd /opt/webapp
          pip install -r requirements.txt
          echo "Installed Python dependencies."

      - name: Check installed packages
        run: pip list

      - name: Build Docker Image for pdns-admin
        run: |
          docker build -t debug-pdns-admin:latest ./pdns-admin
          echo "Built Docker image for pdns-admin."
